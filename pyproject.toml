[project]
name = "pyforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sascha Beck", email = "info@saschahbeck.de" }
]
requires-python = ">=3.14.8"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "faster-whisper>=1.2.1",
    "ipython>=9.17.1",
    "librosa>=1.0.0",
    "llama-cpp-python>=0.3.36",
    "miniaudio>=1.71",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "transformers>=5.18.0",
]

[project.scripts]
pyforge = "pyforge:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
